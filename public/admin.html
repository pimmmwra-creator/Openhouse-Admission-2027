<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin - Stamp Rally</title><link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
<style>body{font-family:Sriracha,system-ui,sans-serif;margin:0;padding:16px;background:#f5f5fa;color:#222}h1{margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.s{background:#fff;border-radius:10px;padding:12px 16px;min-width:120px}.s b{font-size:24px;display:block}input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc}button{background:#3b2f6b;color:#fff;border:0;cursor:pointer}table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{padding:7px 9px;border-bottom:1px solid #eee;text-align:left}.w{overflow-x:auto}</style></head><body>
<h1>Admin Dashboard</h1>
<div class="row"><input id="k" type="password" placeholder="Admin key"><button id="go">เข้าสู่ระบบ</button><button id="ex" style="display:none">Export CSV</button></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key=sessionStorage.getItem('ak')||'',D=null;if(key){$('#k').value=key;load()}
$('#go').onclick=()=>{key=$('#k').value;sessionStorage.setItem('ak',key);load()};
async function load(q=''){const r=await fetch('/api/admin/players',{headers:{'x-admin-key':key}});
 if(!r.ok){$('#out').innerHTML='<p>รหัสไม่ถูกต้อง</p>';return}
 D=await r.json();$('#ex').style.display='';draw(q)}
function draw(q=''){const s=D.stats,f=D.players.filter(p=>(p.full_name+p.school+p.id).toLowerCase().includes(q.toLowerCase()));
 $('#out').innerHTML=`<div class="row"><div class="s"><b>${s.players}</b>ผู้ลงทะเบียน</div><div class="s"><b>${s.stamps}</b>แสตมป์ทั้งหมด</div><div class="s"><b>${s.finished}</b>กดเสร็จสิ้น</div><div class="s"><b>${s.redeemed}</b>รับไอติมแล้ว</div><div class="s"><b>${s.finished-s.redeemed}</b>รอรับไอติม</div></div>
 <div class="row"><input id="q" placeholder="ค้นหาชื่อ / โรงเรียน / Player ID" value="${esc(q)}" style="flex:1"></div>
 <div class="w"><table><tr><th>ชื่อ</th><th>โรงเรียน/ชั้น</th><th>Player ID</th><th>แสตมป์</th><th>รางวัล</th><th>ความยินยอม</th><th></th></tr>${f.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.school)} ${esc(p.grade)}</td><td>${p.id.slice(0,8)}</td><td>${p.stamps.length}/4</td><td>${p.reward?p.reward.status:'-'}</td><td>${p.consent_status?'✓ '+new Date(p.consent_at).toLocaleString('th-TH'):'-'}</td><td>${p.reward&&p.reward.status==='NOT_REDEEMED'?`<button data-id="${p.id}">ยืนยันแจกไอติม</button>`:''} <button data-del="${p.id}" style="background:#c0392b">ลบข้อมูล</button></td></tr>`).join('')}</table></div>
 <h3>ความคิดเห็นผู้เล่น (${D.feedback.length})</h3><div class="w"><table><tr><th>คะแนน</th><th>ความคิดเห็น</th><th>เวลา</th></tr>${D.feedback.map(f=>`<tr><td>${'⭐'.repeat(f.rating)}</td><td>${esc(f.comment)}</td><td>${new Date(f.created_at).toLocaleString('th-TH')}</td></tr>`).join('')}</table></div>
 <h3>Activity Logs</h3><div class="w"><table><tr><th>เวลา</th><th>เหตุการณ์</th><th>Player</th><th>รายละเอียด</th></tr>${D.logs.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('th-TH')}</td><td>${esc(l.action)}</td><td>${esc((l.player_id||'').slice(0,8))}</td><td>${esc(JSON.stringify(l.details||{}))}</td></tr>`).join('')}</table></div>`;
 $('#q').oninput=e=>{draw(e.target.value);$('#q').focus()};
 document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/admin/redeem',{method:'POST',headers:{'x-admin-key':key,'Content-Type':'application/json'},body:JSON.stringify({player_id:b.dataset.id})});const j=await r.json();if(!r.ok)alert(j.error);load()});
 document.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบข้อมูลผู้เล่นรายนี้ถาวร?'))return;const r=await fetch('/api/admin/delete-player',{method:'POST',headers:{'x-admin-key':key,'Content-Type':'application/json'},body:JSON.stringify({player_id:b.dataset.del})});if(!r.ok)alert('ลบไม่สำเร็จ');load()})}
$('#ex').onclick=()=>{const rows=[['id','name','school','grade','stamps','reward','redeemed_at','consent_at']].concat(D.players.map(p=>[p.id,p.full_name,p.school,p.grade,p.stamps.length,p.reward?p.reward.status:'',p.reward&&p.reward.redeemed_at||'',p.consent_at||'']));
 const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='players.csv';a.click()};
</script></body></html>
